name: Handoff CI

on:
  workflow_dispatch:

jobs:
  Handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Write handoff summary
        run: |
          echo 'release-handoff-evidence CI run for handover documentation - artifacts upload handoff-summary' > handoff-summary.txt

      - name: Upload handoff summary
        uses: actions/upload-artifact@v4
        with:
          name: handoff-summary
          path: handoff-summary.txt
